[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csl-pipeline"
version = "0.1.0"
description = "Multi-channel re-derivation and closure pipeline for CSL and Diosi-Penrose collapse models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sympy==1.14.0",
    "mpmath==1.3.0",
    "numpy<2.3",
    "scipy",
    "qutip==5.3.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "hypothesis",
    "pint",
    "uncertainties",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running numerical tests",
    "cas: requires the WolframScript executable",
]
